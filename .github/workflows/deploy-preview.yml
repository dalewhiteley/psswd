name: Deploy Preview

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    environment:
      name: Development

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      - name: Install dependencies
        run: yarn

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Deploy PR stage
        run: |
          STAGE=pr-${{ github.event.pull_request.number }}
          DOMAIN=${{ vars.DOMAIN_NAME }}

          yarn sst deploy --stage $STAGE

          if [[ "$STAGE" == "development" || "$STAGE" == "testing" ]]; then
            PREVIEW_URL="https://$STAGE.$DOMAIN"
          else
            PREVIEW_URL="https://$STAGE.development.$DOMAIN"
          fi
          
          echo "STAGE=$STAGE" >> $GITHUB_ENV
          echo "PREVIEW_URL=$PREVIEW_URL" >> $GITHUB_ENV
        env:
          KOFI_USER: ${{ vars.KOFI_USER }}
          HOSTED_ZONE: ${{ vars.HOSTED_ZONE }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: deploy-preview
          message: |
            ✅ Preview deployed for **PR #${{ github.event.pull_request.number }}**
            **Stage:** `${{ env.STAGE }}`
            **URL:** ${{ env.PREVIEW_URL }}
